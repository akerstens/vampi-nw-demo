name: Active Scan

on:
  push:
    branches: [ main ]
  pull_request:
  repository_dispatch:
  workflow_dispatch:

jobs:
  active-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Standalone VAmPI Container
        # Run only the vulnerable container flavor directly on host port 5002
        run: |
          docker run -d -p 5002:5000 -e vulnerable=1 erev0s/vampi:latest
        
      - name: Test VAmPI
        run: sleep 10 && curl http://localhost:5002/ --retry 10 --retry-delay 2 

      - name: Createdb
        run: curl http://localhost:5002/createdb

      - name: Run Active Scan
        uses: nonamesec/active-scan-action@v1
        with:
          ENV_ID: "775e6c9d-dc57-4f6a-b5ba-184f1f55730b"
          ACTIVE_REGISTRY_URL: "us-central1-docker.pkg.dev/noname-artifacts/nns-docker"
          ACTIVE_REGISTRY_USER: "_json_key_base64"
          ACTIVE_REGISTRY_PASSWORD: ""
          ACTIVE_API_URL: "https://active-demo.nonamesec.com/active"
          CORE_CLI_CLIENT_ID: "9cc6ef9433355655678b4e3adc8b4ae165f7bed5a4664f66cc3a381acb6fcd3b"
          CORE_CLI_CLIENT_SECRET: "ba9fca69c8a1fbe47195671f1dfcce39605e0bd5dcdca31973a1a1b857c84ff73b3a61b351687d8a19a55f8336a8b9bce17b30cb32d8bd70ebf4b0d3c05e0ead"
          ACTIVE_BACKEND_URI: "https://active-demo.nonamesec.com/active/backend"
          TEST_GROUP_ID: "892b51de-67cf-4328-beea-3ade61bcdeb2"
          BRANCH_NAME: "${{ github.ref_name }}"
          VERBOSE: "true"
          ANALYZE: "true"
          USE_ZAP: "false"

  deploy:
    needs: active-scan 
    runs-on: ubuntu-latest 
    steps:
      - name: echo
        run: echo Security scan passed, deploying to production
